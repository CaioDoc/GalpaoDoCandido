<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Galpão do Cândido Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
</head>

<body class="login-body">
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-mark">G</span>
                <div>
                    <div class="login-store-name">Galpão do Cândido</div>
                    <div class="login-store-sub">Painel Administrativo</div>
                </div>
            </div>

            <h1 class="login-title">Entrar</h1>

            <form class="login-form" id="login-form" novalidate>
                <div class="field-group">
                    <label for="username" class="field-label">Usuário</label>
                    <input type="text" id="username" name="username" class="field-input" placeholder="admin"
                        autocomplete="username" required />
                </div>

                <div class="field-group">
                    <label for="password" class="field-label">Senha</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" class="field-input" placeholder="••••••••"
                            autocomplete="current-password" required />
                        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn-login" id="login-btn">
                    <span class="btn-login-text">Entrar</span>
                    <span class="btn-login-spinner" id="login-spinner" style="display:none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 11-6.219-8.56" stroke-linecap="round" />
                        </svg>
                    </span>
                </button>
            </form>

            <a href="/" class="back-link">← Voltar para a loja</a>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('login-form');
            const errorEl = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            const spinner = document.getElementById('login-spinner');
            const btnText = document.querySelector('.btn-login-text');
            const togglePass = document.getElementById('toggle-pass');
            const passInput = document.getElementById('password');

            // Toggle password visibility
            togglePass.addEventListener('click', () => {
                const isText = passInput.type === 'text';
                passInput.type = isText ? 'password' : 'text';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.textContent = '';
                errorEl.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const password = passInput.value;

                if (!username || !password) {
                    showError('Preencha todos os campos.');
                    return;
                }

                setLoading(true);

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        window.location.href = '/admin';
                    } else {
                        showError(data.error || 'Credenciais inválidas.');
                    }
                } catch {
                    showError('Erro de conexão. Tente novamente.');
                } finally {
                    setLoading(false);
                }
            });

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            }

            function setLoading(on) {
                loginBtn.disabled = on;
                spinner.style.display = on ? 'inline-flex' : 'none';
                btnText.textContent = on ? 'Entrando...' : 'Entrar';
            }
        })();
    </script>
</body>

</html>
